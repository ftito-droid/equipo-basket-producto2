<video
  *ngIf="selectedPlayer"
  #videoPlayer
  id="player"
  class="player-video"
  controls
>
  <source [src]="selectedPlayer?.video" type="video/mp4">
  Tu navegador no soporta video.
</video>

<div class="video-controls" *ngIf="selectedPlayer">
  <button (click)="play()">Play</button>
  <button (click)="pause()">Pause</button>
  <button (click)="stop()">Stop</button>
</div>
