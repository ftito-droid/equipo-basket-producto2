<div class="filters-card custom-filters">

  <!-- BUSCADOR POR NOMBRE -->
  <div class="filter-group">
    <label>Buscar por nombre</label>
    <input
      type="text"
      class="filter-input"
      placeholder="Ej: Juan, Carlos..."
      [(ngModel)]="search">
  </div>

  <!-- FILTRO POR POSICIÓN -->
  <div class="filter-group">
    <label>Posición</label>
    <select [(ngModel)]="positionFilter" class="filter-input">
      <option value="">Todas las posiciones</option>
      <option value="Base">Base</option>
      <option value="Escolta">Escolta</option>
      <option value="Alero">Alero</option>
      <option value="Pivot">Pivot</option>
    </select>
  </div>

  <!-- FILTRO POR EDAD -->
  <div class="filter-group">
    <label>Edad mínima</label>
    <input
      type="number"
      class="filter-input"
      placeholder="Ej: 20"
      [(ngModel)]="ageFilter">
  </div>

  <!-- FILTRO POR EQUIPO -->
  <div class="filter-group">
    <label>Equipo</label>
    <input
      type="text"
      class="filter-input"
      placeholder="Ej: Lakers"
      [(ngModel)]="teamFilter">
  </div>

</div>

<div class="mb-3">
  <button class="btn btn-success" (click)="toggleNewPlayerForm()">
    + Nuevo jugador
  </button>
</div>
<div *ngIf="showNewPlayerForm" class="card p-3 mb-3">
  <h5>Nuevo jugador</h5>
  <p>Aquí irá el formulario.</p>
</div>

<!-- 1. Envolvemos todo en un ng-container que espera los datos de Firebase -->
<ng-container *ngIf="(players$ | async) || [] as listPlayers; else loading"> 

  <!-- LISTADO DE JUGADORES -->
  <ul class="list-group players-list">
    <!-- 2. Ahora usamos 'listPlayers' que ya está garantizado que no es null -->
    <li
      *ngFor="let player of listPlayers | filterPlayers: search : positionFilter : ageFilter : teamFilter"
      class="list-group-item list-group-item-action d-flex align-items-center player-item"
      style="cursor: pointer;"
    >
      <div class="d-flex align-items-center flex-grow-1" (click)="selectPlayer(player)">
        <img
          [src]="player.foto"
          alt="foto"
          class="rounded me-3 player-image"
          width="50"
          height="50"
        >
       <div class="player-text">
        <div class="player-name">{{ player.nombre }} {{ player.apellidos }}</div>
        <div class="player-position">{{ player.posicion }}</div>
       </div>
      </div>
      <!-- Botón para Borrar -->
      <button 
        class="btn btn-danger btn-sm" 
        (click)="deletePlayer(player.id); $event.stopPropagation()">
        ❌ Borrar
      </button>
    </li>
  </ul>

</ng-container>

<!-- 3. Mensaje que se muestra mientras Firebase carga los datos -->
<ng-template #loading>
  <div class="text-center p-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2">Cargando jugadores desde Firebase...</p>
  </div>
</ng-template>
